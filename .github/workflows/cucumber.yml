name: Cucumber BDD Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      tags:
        description: "Cucumber tag expression, e.g. '@smoke' or '@api and not @known-defect'"
        required: false
        default: "not @known-defect"

permissions:
  contents: read

jobs:
  cucumber:
    name: Cucumber BDD - UI (Chrome) and API
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: cucumber

    env:
      # Confirmed application defects are tagged @known-defect and stay out of the green pipeline.
      CUCUMBER_TAGS: ${{ inputs.tags || 'not @known-defect' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Compile Cucumber framework
        run: mvn clean test-compile

      - name: Run Cucumber BDD suite
        run: >
          mvn test
          -Dcucumber.filter.tags="$CUCUMBER_TAGS"
          -Dheadless=true
          -Dbrowser=chrome

      - name: Upload Cucumber reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-reports
          path: cucumber/target/cucumber-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-surefire-reports
          path: cucumber/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-allure-results
          path: cucumber/target/allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-failure-screenshots
          path: reports/cucumber/screenshots
          if-no-files-found: ignore
          retention-days: 14
