name: Cypress Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cypress:
    name: Cypress UI and API Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: cypress

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: cypress/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript validation
        run: npm run typecheck

      - name: Run Cypress functional UI tests
        run: npm run cy:functional

      - name: Run Cypress API tests
        run: npm run cy:api

      - name: Generate Mochawesome report
        if: always()
        run: |
          if compgen -G "../reports/cypress/mochawesome/*.json" > /dev/null; then
            npm run cy:report
          else
            echo "No Mochawesome JSON results were generated."
          fi

      - name: Upload Cypress test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cypress-test-results
          path: |
            reports/cypress/html/
            reports/cypress/mochawesome/
            reports/cypress/mochawesome.json
            reports/cypress/screenshots/
            reports/cypress/videos/
          if-no-files-found: ignore
          retention-days: 14