name: Postman API Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  postman:
    name: Postman / Newman API Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: api-testing/postman

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: api-testing/postman/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Create report directory
        run: mkdir -p ../../reports/postman

      - name: Run Newman API suite
        run: npm run test:ci

      - name: Upload Newman HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-newman-html-report
          path: reports/postman/postman-report.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Newman JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: postman-newman-json-report
          path: reports/postman/postman-report.json
          if-no-files-found: ignore
          retention-days: 14
