name: Selenium Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  selenium:
    name: Selenium - Chrome
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: selenium

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Set up Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Verify Java
        run: java -version

      - name: Verify Maven
        run: mvn -version

      - name: Compile Selenium framework
        run: mvn clean test-compile

      - name: Run Selenium functional suite
        run: >
          mvn test
          -DexcludedGroups=known-defect
          -Dheadless=true
          -Dbrowser=chrome

      - name: Upload Surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-surefire-reports
          path: selenium/target/surefire-reports
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-allure-results
          path: selenium/target/allure-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: selenium-failure-screenshots
          path: reports/selenium/screenshots
          if-no-files-found: ignore
          retention-days: 14
