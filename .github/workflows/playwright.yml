name: Playwright Tests

on:
  pull_request:
    branches:
      - main

  push:
    branches:
      - main
      - feature/playwright-framework

  workflow_dispatch:

permissions:
  contents: read

jobs:
  playwright:
    name: Playwright - ${{ matrix.browser }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false

      matrix:
        browser:
          - chromium
          - firefox
          - webkit

    defaults:
      run:
        working-directory: playwright

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: playwright/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check TypeScript
        run: npm run typecheck

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run Playwright tests
        run: npx playwright test --project=${{ matrix.browser }}

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-html-${{ matrix.browser }}
          path: reports/playwright/html-report
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results-${{ matrix.browser }}
          path: reports/playwright/test-results
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JSON report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-json-${{ matrix.browser }}
          path: reports/playwright/results.json
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-junit-${{ matrix.browser }}
          path: reports/playwright/junit-results.xml
          if-no-files-found: ignore
          retention-days: 14
